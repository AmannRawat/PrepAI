
services:
  # Node.js + Express backend
  backend:
    build:
      context: ./server
    container_name: prepai-server
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:9000}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./server/.env
        required: false
    restart: unless-stopped

  # React + Vite frontend
  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: prepai-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    restart: unless-stopped

  # Optional local Qdrant for development only.
  # Not started by the default `docker compose up`.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: prepai-qdrant
    profiles:
      - local
      - dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data: